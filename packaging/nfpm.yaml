# nfpm config for building .deb and .rpm packages from the prebuilt static
# binary. The release workflow stages it under ./stage and sets VER and
# PKG_ARCH in the environment before invoking nfpm once per arch/format.
name: maxelotl
arch: ${PKG_ARCH}
version: ${VER}
release: 1
section: web
priority: optional
maintainer: proximile <proximile@users.noreply.github.com>
description: |
  Lightweight command line download accelerator (a drop-in axel fork).
  Downloads a file from several mirrors and/or connections at once. This build
  raises the URL length limit so very long links (presigned cloud-storage URLs,
  OAuth query strings) work out of the box. Installs as `maxelotl` with an
  `axel` alias.
vendor: proximile
homepage: https://github.com/proximile/maxelotl
license: GPL-2.0-or-later

# The binary is fully static, so it has no shared-library dependencies.
contents:
  - src: stage/usr/bin/maxelotl
    dst: /usr/bin/maxelotl
    file_info:
      mode: 0755
  # Drop-in alias so `axel` keeps working.
  - src: /usr/bin/maxelotl
    dst: /usr/bin/axel
    type: symlink
  - src: stage/usr/share/doc/maxelotl/copyright
    dst: /usr/share/doc/maxelotl/copyright
    file_info:
      mode: 0644

overrides:
  deb:
    # Replace and take precedence over the distro's stock axel package.
    replaces:
      - axel
    conflicts:
      - axel
    provides:
      - axel
  rpm:
    replaces:
      - axel
    conflicts:
      - axel
    provides:
      - axel
