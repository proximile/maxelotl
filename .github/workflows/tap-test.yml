name: tap-test

# Throwaway: verify `brew install proximile/tap/maxelotl` works end to end and
# sets up both the maxelotl command and the axel alias.
on:
  workflow_dispatch:

jobs:
  brew-install:
    runs-on: macos-14
    steps:
      - name: brew install from the tap
        run: |
          set -x
          brew update
          brew install --build-from-source proximile/tap/maxelotl
          which maxelotl
          which axel
          maxelotl --version | head -1
          axel --version | head -1
          maxelotl --help >/dev/null && echo "maxelotl runs OK"
